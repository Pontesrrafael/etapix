[package]
name = "etapix-setup"
version = "0.1.0"
edition = "2021"
description = "Per-user installer for Etapix: no admin rights, no changes to Microsoft Project"
license = "MIT OR Apache-2.0"

[[bin]]
name = "etapix-setup"
path = "src/main.rs"

[dependencies]
rfd = "0.15"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_System_Com", "Win32_System_Registry", "Win32_UI_Shell"] }
