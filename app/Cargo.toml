[package]
name = "etapix"
version = "0.1.0"
edition = "2021"
description = "Desktop project planner for internal use, built on pjsched; reads and writes Microsoft Project XML"
license = "MIT OR Apache-2.0"

[dependencies]
pjsched = { path = ".." }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
eframe = "0.29"
egui_extras = "0.29"
rfd = "0.15"
